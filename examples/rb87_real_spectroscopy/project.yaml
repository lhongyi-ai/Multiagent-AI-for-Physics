    parameter_bounds: {d2_center_mhz: [384230480.0, 384230490.0]}
    fit_parameters: {d2_center_mhz: 384230484.4685}
    selection_rule_score: 1.0
    limiting_case_score: 1.0
    identifiability_condition: 1.0
    counterexample_survival: 0.2
    atomic_model:
      schema_version: v18
      model_id: rb87-independent-levels
      candidate_id: independent_levels
      model_family: finite_level_hamiltonian
      basis_states: [{state_id: g, label: ground}, {state_id: e, label: excited}]
      hamiltonian_terms: [{term_id: optical-anchor, term_type: diagonal_energy, coefficient: 384230484.4685, unit: MHz, state_ids: [e]}]
      parameters: []
      requested_observables: [{observable_id: transitions, observable_type: transition_frequencies, unit: MHz}]
      field_configuration: {}
      units: {hamiltonian: Hz}
      solver_preferences: {}
      assumptions: [independent optical levels]
      limits_to_check: {}
    provenance: [src-rb87-steck-local]
