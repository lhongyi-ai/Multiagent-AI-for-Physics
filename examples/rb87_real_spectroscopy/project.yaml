campaign:
  schema_version: v19
  campaign_id: rb87-real-spectroscopy
  problem_id: rb87-effective-hamiltonian
  domain: atomic_amo_physics
  pilot_name: 87Rb D-line hyperfine and low-field Zeeman campaign
  research_question: Given curated 87Rb spectroscopy observations, which bounded effective Hamiltonian family best reconstructs observed structure and predicts held-out observables?
  dataset_manifest_id: rb87-dataset-v1
  train_split_id: rb87-train-v1
  validation_split_id: rb87-validation-v1
  test_split_id: rb87-test-v1
  candidate_families:
    - independent_levels
    - hyperfine_only
    - hyperfine_linear_field
    - overparameterized_extra_term
    - ambiguous_reparameterization
  allowed_hamiltonian_terms: [diagonal_energy, hyperfine_scalar, zeeman_linear, custom_matrix_literal]
  allowed_verifiers: [atomic_schema, numerical_diagonalization, spectrum_consistency, selection_rules, limiting_cases, parameter_fit, counterexample_parameter_search]
  search_configuration: {beam_width: 4, max_steps: 8}
  budget_configuration: {model_calls: 0, token_budget: 0, scientific_package_calls: 200}
  success_criteria:
    - recover best-supported bounded family without leaking held-out answers
    - preserve equivalent candidate groups
    - produce discriminating observable proposals
  failure_criteria:
    - force a unique winner when observations are insufficient
    - leak evaluator-only test values to agent-visible artifacts
  novelty_policy: benchmark known Rb87 structure only; no new-physics claim
  expert_review_policy: expert review required before any scientific interpretation
  stopping_policy: stop after deterministic comparison and stress tests
  status: drafted
  provenance: [examples/rb87_real_spectroscopy/project.yaml]
