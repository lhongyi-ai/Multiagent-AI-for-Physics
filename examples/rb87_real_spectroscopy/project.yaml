open_problem_campaign_template:
  schema_version: v19
  template_id: v20-open-problem-template
  precise_unresolved_claim: Replace this with a bounded unresolved Atomic/AMO claim.
  current_best_known_baselines: [best evaluated model, simplest effective model]
  candidate_representation: AtomicModelSpec with curated observation records.
  automated_verifier_coverage: [unit checks, spectrum residuals, selection rules, identifiability, stress tests]
  unresolved_uncertainty: [source conflicts, apparatus systematics, missing physical effects]
  novelty_definition: Improvement over explicitly named baselines under held-out tests.
  falsification_criteria: [held-out residual exceeds tolerance, selection rules fail, counterexample found]
  expert_contact_or_review_plan: Named domain expert review before claims.
  allowed_external_tools: [local scientific packages only unless explicitly authorized]
  stopping_conditions: [budget exhausted, model-space insufficient, expert review requested]
  publication_and_disclosure_policy: No public scientific claim without expert review and source audit.
