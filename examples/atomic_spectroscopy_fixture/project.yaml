schema_version: v17
project_id: atomic-spectroscopy-fixture
title: Synthetic atomic spectroscopy inverse-problem benchmark
model_mode: mock
literature_mode: fixture
grounding_mode: strict
random_seed: 18
problem:
  problem_id: atomic-inverse-fixture
  title: Recover finite-level atomic models from synthetic spectra
  precise_statement: Use deterministic package-backed verifiers to recover hidden finite-level Hamiltonians from bounded synthetic spectroscopy observations.
  problem_type: inverse_problem
  scientific_domain: atomic_amo_physics
  candidate_types: [mechanistic_model, counterexample, experiment_plan]
  known_constraints:
    - constraint_id: c-safe-model
      description: Candidate models must use AtomicModelSpec and allowlisted Hamiltonian terms only.
      hard: true
  success_criteria:
    - criterion_id: s-family-recovery
      description: Select the fixture-correct model in each synthetic benchmark case.
  failure_criteria:
    - criterion_id: f-non-hermitian
      description: Non-Hermitian closed-system Hamiltonians are invalid unless explicitly modeled as open systems.
      severity: high
  observable_targets:
    - observable_id: transition-frequency
      description: Transition frequencies in ordinary frequency units.
      units: MHz
  accepted_evidence_types: [synthetic_observation]
  excluded_claims: [open-problem correctness, real atomic property prediction]
  known_baselines: [one-shot candidate selection, generic V1.7 search]
  corpus_scope: Deterministic synthetic observations only.
  human_notes:
    - This benchmark proves package-backed verification plumbing, not physical discovery.
  provenance: [examples/atomic_spectroscopy_fixture/project.yaml]
evidence_ids: []
