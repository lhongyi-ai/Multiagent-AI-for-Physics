  preserve_diverse_clusters: true
  preserve_counterexample_branch: true
  tournament_max_candidates: 6
  tournament_max_comparisons: 8
  tournament_debate_turns: 1
  plateau_window: 3
  plateau_minimum_improvement: 0.02
  token_budget: 0
  model_call_budget: 0
  verifier_call_budget: 120
enabled_verifiers:
