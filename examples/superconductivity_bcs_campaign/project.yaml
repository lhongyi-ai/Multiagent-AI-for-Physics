campaign:
  campaign_id: superconductivity-bcs-v21
  question: "Can a generalized BCS superconducting state be generated by a mixed pairing interaction containing both phonon-mediated attraction and electron-hole-asymmetric correlated hopping, and can the relative contributions of interaction-energy lowering and kinetic-energy lowering be quantitatively separated across materials and doping?"
  domain: condensed_matter_superconductivity
  bounded_scope: constant-DOS and square-lattice toy models with local fixture records
sources:
  - source_id: src-superconductivity-corpus
    title: Local superconductivity curation fixture
    source_type: scholarly_fixture
    local_snapshot: sources/superconductivity_corpus.jsonl
    provenance: [local_fixture]
data_sources:
  supercon: sources/supercon_fixture.csv
  materials_project: sources/materials_project_fixture.jsonl
  nomad: sources/nomad_fixture.jsonl
  optimade: sources/optimade_fixture.jsonl
corpus_path: sources/superconductivity_corpus.jsonl
material_mappings:
  - material_id: mat-al
    formula: Al
    family: conventional_elemental
    tc_k: 1.2
    doping_label: stoichiometric
    mapping_assumptions: [weak-coupling conventional reference]
    mapping_uncertainty: medium
    unsupported_fields: [optical_cutoff_series, material_specific_correlated_hopping]
  - material_id: mat-mgb2
    formula: MgB2
    family: conventional_strong_electron_phonon
    tc_k: 39.0
    doping_label: stoichiometric
    mapping_assumptions: [strong electron-phonon reference, multiband physics not modeled]
    mapping_uncertainty: high
    unsupported_fields: [multiband_gap_structure]
  - material_id: mat-lsco
    formula: La2-xSrxCuO4
    family: cuprate
    tc_k: 38.0
    doping_label: x~0.15 ambiguous
    mapping_assumptions: [single-band toy proxy only]
    mapping_uncertainty: very_high
    unsupported_fields: [strong_correlation_model, precise_carrier_concentration, optical_cutoff_consensus]
model_specs:
  - model_id: model-phonon
    candidate_id: cand-phonon-dominant
    family: phonon_only_bcs
    lattice:
      lattice_id: constant-dos
      kind: constant_dos
      dimension: 0
      k_grid_size: 64
      density_of_states: 1.0
      bandwidth_ev: 1.0
    dispersion:
      dispersion_id: flat-dos
      nearest_neighbor_t_ev: 0.25
      next_nearest_neighbor_t_ev: 0.0
      electron_hole_asymmetry: 0.0
      sign_convention: negative hopping lowers band energy
    filling:
      filling: 1.0
      temperature_k: 0.0
      fixed_quantity: fixed_particle_number
    pairing_kernel:
      kernel_id: kernel-phonon
      phonon:
        coupling_ev: 0.34
        cutoff_ev: 0.08
        isotope_sensitive: true
        provenance: [src-bcs-foundation-note]
      correlated_hopping:
        coupling_ev: 0.0
        asymmetry_parameter: 0.0
        operator_structure: none
        provenance: []
      channels:
        - channel_id: s
          symmetry: s_wave
          contributes_to: interaction
          sign_convention: positive coupling means attractive contribution in the effective pairing kernel
      separable: true
    material_mappings: []
    provenance: [local_fixture]
  - model_id: model-correlated
    candidate_id: cand-kinetic-dominant
    family: correlated_hopping_only
    lattice:
      lattice_id: square-lattice
      kind: two_dimensional_square
      dimension: 2
      k_grid_size: 48
      density_of_states: 1.0
      bandwidth_ev: 1.5
    dispersion:
      dispersion_id: asymmetric-square
      nearest_neighbor_t_ev: 0.25
      next_nearest_neighbor_t_ev: -0.05
      electron_hole_asymmetry: 0.8
      sign_convention: negative hopping lowers band energy
    filling:
      filling: 1.2
      temperature_k: 0.0
      fixed_quantity: fixed_particle_number
    pairing_kernel:
      kernel_id: kernel-correlated
      phonon:
        coupling_ev: 0.0
        cutoff_ev: 0.08
        isotope_sensitive: false
        provenance: []
      correlated_hopping:
        coupling_ev: 0.56
        asymmetry_parameter: 0.8
        operator_structure: density-dependent nearest-neighbor hopping projected to a pairing channel
        provenance: [src-correlated-hopping-note]
      channels:
        - channel_id: extended-s
          symmetry: extended_s
          contributes_to: kinetic
          sign_convention: positive coupling means attractive contribution in the effective pairing kernel
      separable: true
    material_mappings: []
    provenance: [local_fixture]
  - model_id: model-mixed
    candidate_id: cand-mixed-pairing
    family: mixed_phonon_correlated_hopping
    lattice:
      lattice_id: square-lattice
      kind: two_dimensional_square
      dimension: 2
      k_grid_size: 64
      density_of_states: 1.0
      bandwidth_ev: 1.5
    dispersion:
      dispersion_id: mixed-asymmetric-square
      nearest_neighbor_t_ev: 0.25
      next_nearest_neighbor_t_ev: -0.04
      electron_hole_asymmetry: 0.5
      sign_convention: negative hopping lowers band energy
    filling:
      filling: 1.15
      temperature_k: 0.0
      fixed_quantity: fixed_particle_number
    pairing_kernel:
      kernel_id: kernel-mixed
      phonon:
        coupling_ev: 0.22
        cutoff_ev: 0.08
        isotope_sensitive: true
        provenance: [src-bcs-foundation-note]
      correlated_hopping:
        coupling_ev: 0.32
        asymmetry_parameter: 0.5
        operator_structure: density-dependent nearest-neighbor hopping projected to a pairing channel
        provenance: [src-correlated-hopping-note]
      channels:
        - channel_id: s
          symmetry: s_wave
          contributes_to: mixed
          sign_convention: positive coupling means attractive contribution in the effective pairing kernel
      separable: true
    material_mappings: []
    provenance: [local_fixture]
  - model_id: model-underdetermined
    candidate_id: cand-separation-protocol
    family: mixed_underdetermined
    lattice:
      lattice_id: constant-dos-underdetermined
      kind: constant_dos
      dimension: 0
      k_grid_size: 64
      density_of_states: 1.0
      bandwidth_ev: 1.0
    dispersion:
      dispersion_id: weak-asymmetry
      nearest_neighbor_t_ev: 0.25
      next_nearest_neighbor_t_ev: 0.0
      electron_hole_asymmetry: 0.1
      sign_convention: negative hopping lowers band energy
    filling:
      filling: 1.03
      temperature_k: 0.0
      fixed_quantity: fixed_particle_number
    pairing_kernel:
      kernel_id: kernel-underdetermined
      phonon:
        coupling_ev: 0.30
        cutoff_ev: 0.08
        isotope_sensitive: true
        provenance: [src-bcs-foundation-note]
      correlated_hopping:
        coupling_ev: 0.10
        asymmetry_parameter: 0.1
        operator_structure: weak density-dependent hopping projection
        provenance: [src-correlated-hopping-note]
      channels:
        - channel_id: s
          symmetry: s_wave
          contributes_to: mixed
          sign_convention: positive coupling means attractive contribution in the effective pairing kernel
      separable: true
    material_mappings: []
    provenance: [local_fixture]
