schema_version: v17
project_id: discovery-search-fixture
title: Offline discovery search fixture
model_mode: mock
literature_mode: fixture
grounding_mode: strict
random_seed: 11
problem:
  problem_id: toy-materials-mechanism
  title: Toy Ca-Fe-Al mechanism search
  precise_statement: Search for candidate explanations and discriminating checks for a Ca-poor recovered crystal outcome in a local Ca-Fe-Al synthesis fixture.
  problem_type: mechanism_discovery
  scientific_domain: materials_synthesis
  candidate_types: [hypothesis, counterexample, mechanistic_model, experiment_plan]
  known_constraints:
    - constraint_id: c-offline
      description: Use only fixture evidence and deterministic verifiers.
      hard: true
  success_criteria:
    - criterion_id: s-verified
      description: Candidate preserves evidence references, predicts observables, and survives deterministic verifier checks.
  failure_criteria:
    - criterion_id: f-missing-falsification
      description: Candidate lacks falsification criteria or has invalid references.
      severity: high
  observable_targets:
    - observable_id: ca-bulk
      description: Bulk Ca concentration of recovered crystals.
      units: atomic fraction
  accepted_evidence_types: [fixture_excerpt, user_observation]
  excluded_claims: [scientific proof, autonomous lab execution]
  known_baselines: [insufficient evidence baseline]
  corpus_scope: Small local fixture; not a complete literature review.
  human_notes:
    - This benchmark tests the search runtime, not scientific truth.
  provenance: [examples/discovery_search_fixture/project.yaml]
evidence_ids: [exp-edx-1, note-edx-1, note-bulk-1, note-ca-loss-1]
initial_candidates:
  - candidate_id: cand-modest-pass
    problem_id: toy-materials-mechanism
    candidate_type: experiment_plan
    title: Bulk composition first
    summary: Use bulk ICP composition before mechanism-specific claims.
    formal_representation: "CaFe4Al8 discriminator: bulk Ca measurement before loss attribution."
    assumptions:
      - EDX may not represent bulk composition.
    construction_or_model: Measure bulk Ca and compare to target stoichiometry.
    predicted_observables:
      - ICP bulk Ca distinguishes real Ca-poor crystals from EDX undercount.
    falsification_conditions:
      - ICP bulk Ca agrees with EDX near-zero Ca and no surface bias is found.
    parent_ids: []
    root_candidate_id: cand-modest-pass
    lineage_depth: 0
    generation_strategy: mainstream_extension
    linked_evidence_ids: [exp-edx-1, note-edx-1, note-bulk-1]
