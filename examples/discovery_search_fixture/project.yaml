search:
  mode: beam
  max_steps: 12
  beam_width: 4
  max_candidates_total: 40
  max_children_per_candidate: 3
  max_lineage_depth: 5
  preserve_diverse_clusters: true
  preserve_counterexample_branch: true
  tournament_max_candidates: 5
  tournament_max_comparisons: 6
  tournament_debate_turns: 1
  plateau_window: 2
  plateau_minimum_improvement: 0.02
  token_budget: 12000
  model_call_budget: 0
  verifier_call_budget: 80
enabled_verifiers:
  - schema_constraint
  - logical_consistency
  - evidence_consistency
  - counterexample_hook
  - experimental_consistency
  - materials_formula
evaluator_only_ground_truth:
