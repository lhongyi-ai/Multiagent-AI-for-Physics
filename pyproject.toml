[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coscientist"
version = "0.1.0"
description = "Local-first MVP for a multi-agent AI co-scientist workflow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "httpx>=0.27,<1",
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "sympy>=1.11,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
]
atomic = [
    "qutip>=5,<6",
]
ui = [
    "gradio>=4,<6",
]

[project.scripts]
coscientist = "coscientist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: optional live provider smoke tests, skipped unless RUN_LIVE_API_TESTS=1",
]
